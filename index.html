<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have A Mellow Day</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
        }
        body {
            font-family: 'Amatic SC', cursive;
            color: #8B4513;
            text-align: center;
            background: #87CEEB;
            height: 100vh;   /* Ensure full viewport height */
            width: 100vw;    /* Ensure full viewport width */
        }
        .blink {
            color: black; /* Font color remains black */
            position: relative;
            top: -15%; /* Raised by 15% */
        }
        .logo-image {
            background: transparent; /* Ensures no white background */
        }
        #contact, #art, #plants, #clock, #events, #yoga {
            display: none;
        }
        .logo-space {
            pointer-events: none;
            cursor: default;
        }
        .lowered-title {
            position: relative;
            top: 35%;
        }
        .social-media {
            display: none !important;
        }
        .menu-link {
            display: inline-block;
            margin-top: 2em;
            padding: 1em 2em;
            background: #f3e9d2;
            color: #4a3c2a;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            transition: background 0.2s;
        }
        .menu-link:hover {
            background: #e8d7b9;
        }
        .landscape,
        .content,
        .dust-container {
            box-sizing: border-box;
        }
        .landscape {
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            /* fill the background fully */
        }
        .content {
            position: relative;
            min-height: 100vh;
            min-width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* Fix for mountains not filling the bottom */
        .mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            min-height: 200px;
            z-index: 1;
        }
        .franklin-mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #8B4513, #A0522D);
            clip-path: polygon(
                0% 100%,    /* Start at bottom-left */
                0% 80%,     /* Base of first mountain */
                30% 10%,    /* Peak of first (widest) mountain */
                50% 20%,    /* Valley between first and second mountains */
                70% 5%,     /* Peak of second mountain */
                100% 80%,   /* Base of last mountain */
                100% 100%   /* End at bottom-right */
            );
        }
        .desert {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15vh;
            min-height: 80px;
            background: linear-gradient(to top, #e8d7b9 90%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }
        /* Optionally, adjust .sky to cover the top area and .sun/clouds as needed */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 70vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
        }
    </style>
</head>
<body>
    <div class="landscape">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="mountains">
            <div class="franklin-mountains"></div>
            <a href="star.html" class="star"></a>
        </div>
        <div class="desert">
            <a href="cactus.html" class="cactus"></a>
            <a href="cactus.html" class="cactus"></a>
        </div>
    </div>
    <div class="dust-container"></div>
    <div class="content">
        <h1 class="lowered-title">Have A Mellow Day</h1>
        <div class="planet-system">
            <a href="about.html" class="logo-space">
                <img src="themoon.png" alt="Mellow Logo" class="logo-image">
            </a>
        </div>
        <a class="menu-link" href="menu.html">View Our Menu</a>
    </div>
    <div class="social-media">
        <a href="https://www.instagram.com/mellowelpaso" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
        <marquee behavior="scroll" direction="left" scrollamount="3" class="social-text">follow @mellowelpaso</marquee>
    </div>
    <p class="blink"></p>
    <script>
        function createDustParticles() {
            const container = document.querySelector('.dust-container');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('dust-particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 8 + 's';
                container.appendChild(particle);
            }
        }
        createDustParticles();
    </script>
</body>
</html>
