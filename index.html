<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mellow Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff8e1;
    }
    .menu-container {
      max-width: 500px;
      margin: 0 auto;
      padding: 12px;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    @media (max-width: 600px) {
      .menu-container {
        max-width: 100%;
        padding: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="menu-container">
    <img src="day1.png" alt="Mellow Kava Bar Menu" usemap="#mellowmenumap" id="menupic">
    <map name="mellowmenumap">
      <area shape="rect" coords="65,140,260,175" href="https://pay.mellowelpaso.com/firsttime" alt="First Timer" title="First Timer - $8">
      <area shape="rect" coords="65,180,260,215" href="https://pay.mellowelpaso.com/kava" alt="Kavaguama" title="Kavaguama - $20">
      <area shape="rect" coords="70,415,350,445" href="https://pay.mellowelpaso.com/lakavachata" alt="La Kavachata" title="La Kavachata - $7">
      <area shape="rect" coords="70,475,350,505" href="https://pay.mellowelpaso.com/pinacalmada" alt="Pina Calmada" title="Pina Calmada - $7">
      <area shape="rect" coords="70,535,350,565" href="https://pay.mellowelpaso.com/javaconkava" alt="Java Con Kava" title="Java Con Kava - $7">
    </map>
  </div>
  <script>
    // Make image map responsive
    // This script recalculates the area coordinates based on image width
    // Source: https://github.com/davidjbradshaw/image-map-resizer
    function resizeMap() {
      var img = document.getElementById('menupic');
      var areas = document.querySelectorAll('map[name="mellowmenumap"] area');
      var originalWidth = 995; // original day1.png width
      var scale = img.offsetWidth / originalWidth;
      var coords = [
        [65,140,260,175],
        [65,180,260,215],
        [70,415,350,445],
        [70,475,350,505],
        [70,535,350,565]
      ];
      areas.forEach(function(area, i){
        var scaled = coords[i].map(function(val){ return Math.round(val * scale); });
        area.coords = scaled.join(',');
      });
    }
    window.addEventListener('resize', resizeMap);
    window.addEventListener('DOMContentLoaded', function(){
      resizeMap();
      setTimeout(resizeMap, 500); // for image load lag
    });
  </script>
</body>
</html>
