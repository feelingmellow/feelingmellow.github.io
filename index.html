<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have A Mellow Day</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
      .content {
        border-radius: 12px;
        box-shadow: 0 2px 14px rgba(44,36,31,0.08);
        background: rgba(255,255,255,0.85);
        margin-top: 3vh;
      }
      /* Ensure .landscape is behind everything */
      .landscape { z-index: 0 !important; }
      /* Show .content above .landscape */
      .content { z-index: 2 !important; }
    </style>
</head>
<body>
    <div class="landscape">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="mountains">
            <div class="franklin-mountains"></div>
            <a href="star.html" class="star"></a>
        </div>
        <div class="desert">
            <a href="cactus.html" class="cactus"></a>
            <a href="cactus.html" class="cactus"></a>
        </div>
    </div>
    <div class="dust-container"></div>
    <div class="content">
        <h1 class="lowered-title">Have A Mellow Day</h1>
        <div class="planet-system">
            <a href="about.html" class="logo-space">
                <img src="themoon.png" alt="Mellow Logo" class="logo-image"
                  onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/commons/9/99/Black_circle.svg';">
            </a>
        </div>
    </div>
    <div class="social-media">
        <a href="https://www.instagram.com/mellowelpaso" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
        <marquee behavior="scroll" direction="left" scrollamount="3" class="social-text">follow @mellowelpaso</marquee>
    </div>
    <p class="blink"></p>
    <script>
        function createDustParticles() {
            const container = document.querySelector('.dust-container');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('dust-particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(particle);
            }
        }
        createDustParticles();
    </script>
</body>
</html>
