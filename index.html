<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have A Mellow Day</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .blink {
            color: black;
            position: relative;
            top: -15%;
        }
        .logo-image {
            background: transparent;
        }
        #contact, #art, #plants, #clock, #events, #yoga {
            display: none;
        }
        .logo-space {
            pointer-events: none;
            cursor: default;
        }
        .menu-button-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 15%;
            width: 100%;
            text-align: center;
            z-index: 2;
            display: none; /* Hide the menu button */
        }
        /* Use flex to center content vertically */
        .content {
            position: relative;
            z-index: 2;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* Remove the previous .lowered-title top shift! */
        .lowered-title {
            /* position: relative; */
            /* top: 35%; */
            margin-bottom: 16px;
        }
        .planet-system {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Social media bar fixed at bottom */
        .social-media {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            z-index: 10000;
            background: rgba(255,255,255,0.7);
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 20px 8px 12px;
            box-sizing: border-box;
        }
        .social-icon {
            pointer-events: auto;
            cursor: pointer;
            margin-right: 16px;
            font-size: 2em;
        }
        .social-text {
            flex: 1;
            font-family: 'Amatic SC', cursive;
            font-size: 1.3em;
            color: #333;
            background: none;
            border: none;
        }
        .landscape,
        .dust-container {
            z-index: 1 !important;
            position: relative !important;
        }
    </style>
</head>
<body>
    <div class="landscape">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="mountains">
            <div class="franklin-mountains"></div>
            <a href="star.html" class="star"></a>
        </div>
        <div class="desert">
            <a href="cactus.html" class="cactus"></a>
            <a href="cactus.html" class="cactus"></a>
        </div>
    </div>
    <div class="dust-container"></div>
    <div class="content">
        <h1 class="lowered-title">Have A Mellow Day</h1>
        <div class="planet-system">
            <a href="about.html" class="logo-space">
                <img src="themoon.png" alt="Mellow Logo" class="logo-image">
            </a>
        </div>
    </div>
    <div class="menu-button-container">
        <a href="menu.html" class="menu-button">Menu</a>
    </div>
    <div class="social-media">
        <a href="https://www.instagram.com/mellowelpaso" target="_blank" class="social-icon" title="Follow us on Instagram">
            <i class="fab fa-instagram"></i>
        </a>
        <marquee behavior="scroll" direction="left" scrollamount="3" class="social-text">follow @mellowelpaso</marquee>
    </div>
    <p class="blink"></p>
    <script>
        function createDustParticles() {
            const container = document.querySelector('.dust-container');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('dust-particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(particle);
            }
        }
        createDustParticles();
    </script>
</body>
</html>
