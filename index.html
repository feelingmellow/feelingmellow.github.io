<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have A Mellow Day</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .blink {
            color: black;
            position: relative;
            top: -15%;
        }
        .logo-image {
            background: transparent;
        }
        /* Hide all icons except Library and Menu */
        #contact, #art, #plants, #clock, #events, #yoga {
            display: none;
        }
        .logo-space {
            pointer-events: none;
            cursor: default;
        }
        .lowered-title {
            position: relative;
            top: 35%;
        }
        /* Hide the entire social-media bar */
        .social-media {
            display: none !important;
        }
        .menu-main-btn {
            display: inline-block;
            margin: 30px auto 0 auto;
            padding: 18px 36px;
            font-family: 'Amatic SC', cursive;
            font-size: 2rem;
            background: #FFA500;
            color: #fff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(44,36,31,0.10);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .menu-main-btn:hover {
            background: #ff9720;
            color: #fffbe0;
        }
    </style>
</head>
<body>
    <div class="landscape">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="mountains">
            <div class="franklin-mountains"></div>
            <a href="star.html" class="star"></a>
        </div>
        <div class="desert">
            <a href="cactus.html" class="cactus"></a>
            <a href="cactus.html" class="cactus"></a>
        </div>
    </div>
    <div class="dust-container"></div>
    <div class="content">
        <h1 class="lowered-title">Have A Mellow Day</h1>
        <div class="planet-system">
            <a href="about.html" class="logo-space">
                <img src="themoon.png" alt="Mellow Logo" class="logo-image">
            </a>
        </div>
        <a href="menu.html" class="menu-main-btn">View Menu</a>
    </div>
    <p class="blink"></p>
    <script>
        function createDustParticles() {
            const container = document.querySelector('.dust-container');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('dust-particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(particle);
            }
        }
        createDustParticles();
    </script>
</body>
</html>
