<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have A Mellow Day</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .blink {
            color: black; /* Font color remains black */
            position: relative;
            top: -15%; /* Raised by 15% */
        }
        .logo-image {
            background: transparent; /* Ensures no white background */
        }
        /* Hide all icons except Library and Menu */
        #contact, #art, #plants, #clock, #events, #yoga {
            display: none;
        }
        /* Make the moon logo (about.html link) visible but not clickable */
        .logo-space {
            pointer-events: none;
            cursor: default;
        }
        /* Lower the "Have A Mellow Day" text by 15% vertically */
        .lowered-title {
            position: relative;
            top: 35%;
        }
        /* Hide the entire social-media bar */
        .social-media {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="landscape">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="mountains">
            <div class="franklin-mountains"></div>
            <a href="star.html" class="star"></a>
        </div>
        <div class="desert">
            <a href="cactus.html" class="cactus"></a>
            <a href="cactus.html" class="cactus"></a>
        </div>
    </div>
    <div class="dust-container"></div>
    <div class="content">
        <h1 class="lowered-title">Have A Mellow Day</h1>
        <div class="planet-system">
            <!-- The about.html (moon logo) link is now visible but not clickable -->
            <a href="about.html" class="logo-space">
                <img src="themoon.png" alt="Mellow Logo" class="logo-image">
            </a>
            <!-- Menu and Library buttons removed -->
        </div>
    </div>
    <div class="social-media">
        <a href="https://www.instagram.com/mellowelpaso" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
        <marquee behavior="scroll" direction="left" scrollamount="3" class="social-text">follow @mellowelpaso</marquee>
    </div>
    <p class="blink"></p>
    <script>
        function createDustParticles() {
            const container = document.querySelector('.dust-container');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('dust-particle');
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(particle);
            }
        }
        createDustParticles();
    </script>
</body>
</html>
