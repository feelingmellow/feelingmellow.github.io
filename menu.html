<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mellow El Paso Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fffbea;
      color: #4a3c2a;
      margin: 2em;
    }
    h1 {
      text-align: center;
      letter-spacing: 2px;
    }
    ul.menu-list {
      list-style: none;
      padding: 0;
      max-width: 400px;
      margin: 2em auto;
      background: #fffbf0;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    ul.menu-list li {
      margin: 0;
      border-bottom: 1px solid #e6e2d3;
    }
    ul.menu-list li:last-child {
      border-bottom: none;
    }
    ul.menu-list a {
      display: block;
      padding: 1.2em 1.5em;
      color: #4a3c2a;
      text-decoration: none;
      font-size: 1.1em;
      transition: background 0.2s;
    }
    ul.menu-list a:hover {
      background: #f3e9d2;
    }
  </style>
</head>
<body>
  <h1>Mellow El Paso Menu</h1>
  <ul class="menu-list">
    <li><a href="https://pay.mellowelpaso.com/firsttime" target="_blank">First Time</a></li>
    <li><a href="https://pay.mellowelpaso.com/kava" target="_blank">Kava</a></li>
    <li><a href="https://pay.mellowelpaso.com/holyhibiscus" target="_blank">Holy Hibiscus</a></li>
    <li><a href="https://pay.mellowelpaso.com/lavenderhaze" target="_blank">Lavender Haze</a></li>
    <li><a href="https://pay.mellowelpaso.com/javaconkava" target="_blank">Java con Kava</a></li>
    <li><a href="https://pay.mellowelpaso.com/suncitysunset" target="_blank">Sun City Sunset</a></li>
    <li><a href="https://pay.mellowelpaso.com/nopalnoproblem" target="_blank">Nopal No Problem</a></li>
    <li><a href="https://pay.mellowelpaso.com/pinacalmada" target="_blank">Piña Calmada</a></li>
    <li><a href="https://pay.mellowelpaso.com/lakavachata" target="_blank">La Kavachata</a></li>
  </ul>
</body>
</html>
