<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mellow Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #fffbea;
      color: #4a3c2a;
      font-family: 'Amatic SC', Arial, sans-serif;
      margin: 0;
      padding: 5vw;
      text-align: center;
      font-size: 5vw;
    }
    h1 {
      font-size: 8vw;
    }
    .menu-section {
      margin: 8vw 0;
    }
    .menu-item {
      margin: 3vw 0;
      font-size: 5vw;
    }
    @media (min-width: 600px) {
      body { font-size: 2vw; padding: 2vw; }
      h1 { font-size: 3vw; }
      .menu-item { font-size: 2vw; }
    }
  </style>
</head>
<body>
  <h1>Our Menu</h1>
  <div class="menu-section">
    <div class="menu-item">Coffee - $3</div>
    <div class="menu-item">Tea - $2.50</div>
    <div class="menu-item">Pastry - $2</div>
    <!-- More items... -->
  </div>
</body>
</html>
