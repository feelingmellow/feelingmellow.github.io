<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mellow Menu</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .menu-container {
            margin: 0 auto;
            padding: 32px 0;
            max-width: 480px;
            background: rgba(255,255,255,0.7);
            border-radius: 18px;
            box-shadow: 0 2px 10px rgba(44,36,31,0.09);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-title {
            font-family: 'Amatic SC', cursive;
            font-size: 3rem;
            color: #FFA500;
            margin-bottom: 18px;
            text-shadow: 1px 1px #8B4513;
        }
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }
        .menu-item {
            margin: 18px 0;
        }
        .menu-link {
            display: block;
            padding: 18px;
            background: #FFA500;
            color: #fff;
            border-radius: 12px;
            font-size: 1.6rem;
            font-family: 'Amatic SC', cursive;
            text-decoration: none;
            box-shadow: 0 1px 4px rgba(44,36,31,0.06);
            transition: background 0.2s;
            text-align: center;
        }
        .menu-link:hover {
            background: #ff9720;
        }
        .back-btn {
            margin: 16px 0 0 0;
            padding: 10px 30px;
            border: none;
            border-radius: 10px;
            background: #8B4513;
            color: #fff;
            font-family: 'Amatic SC', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #FFA500;
            color: #fffbe0;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <div class="menu-title">Menu</div>
        <ul class="menu-list">
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/firsttime" class="menu-link" target="_blank">First Time Special</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/kava" class="menu-link" target="_blank">Kava</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/holyhibiscus" class="menu-link" target="_blank">Holy Hibiscus</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/lavenderhaze" class="menu-link" target="_blank">Lavender Haze</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/javaconkava" class="menu-link" target="_blank">Java con Kava</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/suncitysunset" class="menu-link" target="_blank">Sun City Sunset</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/nopalnoproblem" class="menu-link" target="_blank">Nopal No Problem</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/pinacalmada" class="menu-link" target="_blank">Piña Calmada</a></li>
            <li class="menu-item"><a href="https://pay.mellowelpaso.com/lakavachata" class="menu-link" target="_blank">La Kavachata</a></li>
        </ul>
        <a href="index.html" class="back-btn">← Back</a>
    </div>
</body>
</html>
